<article class="log-card">
  <div class="log-main">
    <div class="log-date">
      <span class="log-date-item">
        <span class="metric-icon metric-icon-calendar" aria-hidden="true"></span>
        <span>{{ log.date }}</span>
      </span>
      <span class="log-date-item">
        <span class="metric-icon metric-icon-time" aria-hidden="true"></span>
        <span>Start {{ log.time }}</span>
      </span>
    </div>
    <p>{{ log.comment }}</p>
  </div>

  <div class="log-meta">
    <span class="log-pill">
      <span class="metric-icon metric-icon-distance" aria-hidden="true"></span>
      <span>{{ log.totalDistance }} km</span>
    </span>
    <span class="log-pill">
      <span class="metric-icon metric-icon-time" aria-hidden="true"></span>
      <span>{{ log.totalTime }} min</span>
    </span>
    <span class="log-pill">
      <span class="metric-icon metric-icon-star" aria-hidden="true"></span>
      <span>Rating {{ log.rating }}/5</span>
    </span>
    <span class="log-pill">
      <span class="metric-icon metric-icon-difficulty" aria-hidden="true"></span>
      <span>Difficulty {{ log.difficulty }}/5</span>
    </span>
  </div>
</article>
