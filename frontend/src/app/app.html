<div class="app-shell">
  <nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container-fluid app-nav">
      <a class="navbar-brand app-brand" routerLink="/">
        <span class="app-brand-mark" aria-hidden="true"></span>
        <span>Tour Planner</span>
      </a>

      <div class="navbar-nav app-header-actions ms-auto align-items-lg-center">
        @if (authService.isAuthenticated()) {
          <a
            class="nav-link app-header-link"
            routerLink="/tours"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
          >
            Route library
          </a>
          <a
            class="nav-link app-header-link"
            routerLink="/profile"
            routerLinkActive="active"
          >
            {{ authService.currentUser()?.name }}
          </a>
          <button type="button" class="nav-link app-header-link" (click)="logout()">
            Logout
          </button>
        } @else {
          <a class="nav-link app-header-link" routerLink="/login" routerLinkActive="active">Login</a>
          <a class="nav-link app-header-link" routerLink="/register" routerLinkActive="active">
            Register
          </a>
        }
      </div>
    </div>
  </nav>

  <main class="app-content container-fluid py-4">
    <router-outlet></router-outlet>
  </main>
</div>
